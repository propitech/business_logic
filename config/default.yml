Propitech/PreferFailValidation:
  Description: 'Assert failure with `fail_*.with_error(...)`, not a negated `succeed_*`.'
  Enabled: true
  Include:
    - '**/*_spec.rb'

Propitech/PreferSucceedValidation:
  Description: 'Assert success with `succeed_*.with_value(...)`, not a negated `fail_*`.'
  Enabled: true
  Include:
    - '**/*_spec.rb'

Propitech/SeedUsesFactory:
  Description: 'Build seed data with FactoryBot factories and traits; no hand-rolled model create, no command invocation.'
  Enabled: true
  Include:
    - 'db/seeds.rb'
    - 'db/seeds/**/*.rb'

Propitech/SeedUsesContainer:
  Description: 'Fetch a record another seed owns through the container (`container.get`), not a class-level `find_by`.'
  Enabled: true
  Include:
    - 'db/seeds.rb'
    - 'db/seeds/**/*.rb'

Propitech/NoNotImplementedError:
  Description: 'Raise BusinessLogic::AbstractMethodError (a NoMethodError), not NotImplementedError (a ScriptError a bare rescue misses).'
  Enabled: true
  # The rewrite changes the exception's ancestry (ScriptError to StandardError),
  # which changes what surrounding rescue clauses catch — a behavioural change,
  # so `rubocop -a` skips it and only an explicit `rubocop -A` applies it.
  SafeAutoCorrect: false

Propitech/PreferBeDeleted:
  Description: 'Assert Paranoia soft-delete with `be_deleted`, not the `deleted_at` column.'
  Enabled: true
  Include:
    - '**/*_spec.rb'
  # The cop keys off the `deleted_at` receiver pattern and cannot prove the
  # receiver is a Paranoia model, so autocorrect could rewrite a non-paranoid
  # assertion into a call on a `deleted?` predicate that does not exist — a
  # behavioural change, so `rubocop -a` reports and only `rubocop -A` applies.
  SafeAutoCorrect: false
