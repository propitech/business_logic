name: Ruby
permissions:
  contents: read
  pull-requests: write
  actions: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

"on":
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * *"

jobs:
  build:
    name: Ruby
    # A hardcoded ubuntu-latest is refused at dispatch once the org's
    # hosted-minute allowance is spent (PRO-1236). Ruby comes from the runner
    # image because ruby/setup-ruby refuses to install on the fleet, whose
    # hosts are Fedora with an empty tool cache.
    runs-on: ${{ vars.RUNNER_LABELS != '' && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
    container:
      image: ghcr.io/propitech/runner-rails-8.1@sha256:df8bd45f9df37a79d7df7dfc7425c14a9ecadcaa4ec071776e0ddff4303e098a

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The image carries one Ruby, so this replaces the 3.3.7/3.4.5 matrix and
      # setup-ruby's bundler-cache. required_ruby_version moved to ">= 3.4" in
      # the same change, so the gem no longer promises a version CI does not
      # exercise (PRO-1240).
      - name: Install dependencies
        run: bundle install --jobs 4
      - name: Run the default task
        env:
          CI: true
        run: bundle exec rake

      - name: Upload result to Quality.sh
        uses: qltysh/qlty-action/coverage@v2
        if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          token: ${{secrets.QLTY_COVERAGE_TOKEN}}
          files: coverage/.resultset.json

  agents-check:
    name: AGENTS.md integrity
    # See build above.
    runs-on: ${{ vars.RUNNER_LABELS != '' && fromJSON(vars.RUNNER_LABELS) || 'ubuntu-latest' }}
    container:
      image: ghcr.io/propitech/runner-rails-8.1@sha256:df8bd45f9df37a79d7df7dfc7425c14a9ecadcaa4ec071776e0ddff4303e098a
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: ruby bin/agents-check
